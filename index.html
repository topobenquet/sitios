<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitios web para negocios de Asunción</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#f7f5f0;--txt:#1b1b1b;--mut:#666;--card:#fff;--line:#e4e0d8}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--txt:#f2efe9;--mut:#a6a199;--card:#1e1e1e;--line:#2c2c2c}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:17px/1.6 system-ui,sans-serif;padding:56px 16px}
main{max-width:720px;margin:0 auto}
h1{font-size:clamp(32px,7vw,48px);line-height:1.1;margin-bottom:12px}
p{color:var(--mut)}
ul{list-style:none;padding:0;margin-top:32px;display:grid;gap:10px}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:inherit;text-decoration:none;font-weight:700}
a span{display:block;font-weight:400;color:var(--mut);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Tu negocio, con su propia web</h1>
  <p>Páginas rápidas, pensadas para el celular, con menú, ubicación y pedidos por WhatsApp.</p>
  <ul>
    <li><a href="pancho-panza/">Pancho Panza<span>Pancheria, chiviteria y pizzeria · Carmelitas</span></a></li>
  </ul>
</main>
</body>
</html>
